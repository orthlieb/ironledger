# Nginx configuration for Iron Ledger on IONOS VPS.
#
# Install to: /etc/nginx/sites-available/ironledger
# Enable with: ln -s /etc/nginx/sites-available/ironledger /etc/nginx/sites-enabled/
#
# Replace YOURDOMAIN.COM with your actual domain before deploying.
# Run certbot after enabling: certbot --nginx -d YOURDOMAIN.COM

# ── Rate limiting zones ───────────────────────────────────────────────────────
# Defined in the http{} context so they survive across location blocks.
# These are a first line of defence at the Nginx layer, before requests even
# reach Node. The API has its own Redis-backed rate limiting on top.

limit_req_zone $binary_remote_addr zone=login:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=register:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m      rate=120r/m;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name YOURDOMAIN.COM;

    # Allow Let's Encrypt ACME challenges through (certbot needs this)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name YOURDOMAIN.COM;

    # ── TLS (managed by Certbot) ─────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOURDOMAIN.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOURDOMAIN.COM/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────────
    # Helmet handles these for API responses; these apply to static assets too.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"      always;

    # ── Request size limit ────────────────────────────────────────────────────
    # Images (portraits) are stored as base64 in JSONB — allow up to 2MB so
    # a full session payload fits. Nginx rejects oversized requests before
    # they reach Node.
    client_max_body_size 2m;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/ironledger.access.log;
    error_log  /var/log/nginx/ironledger.error.log;

    # ── Static assets (served directly for performance) ───────────────────────
    # adapter-node writes hashed client assets to apps/web/build/client/_app/
    # Long cache is safe because filenames include content hash.
    location /_app/ {
        root /home/ironledger/app/apps/web/build/client;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Static files (foe portraits, icons, etc.)
    location /foes/ {
        root /home/ironledger/app/apps/web/build/client;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Fastify API (direct — bypasses SvelteKit) ────────────────────────────
    # /api/v1/* goes straight to Fastify on port 3000.
    # Auth endpoints get stricter rate limits.

    location = /api/v1/auth/login {
        limit_req zone=login    burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location = /api/v1/auth/register {
        limit_req zone=register burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location /api/v1/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    # Health check — no rate limit, used by deploy script and uptime monitors
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    # ── SvelteKit Node server (SSR + BFF proxy) ───────────────────────────────
    # ALL other traffic — pages, BFF routes (/api/session/*, /api/admin/*,
    # /api/maintenance/*), auth callbacks — goes to the adapter-node server
    # on port 3001. This is critical: the BFF proxy routes read the HttpOnly
    # access_token cookie and forward it as a Bearer header to Fastify.
    # Previously this block was missing, so all session saves (foes,
    # expeditions, communities, NPCs) reached Fastify at the wrong path and
    # returned 404 — silently losing all user data.
    location / {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
    }

    # ── Block common attack paths ─────────────────────────────────────────────
    # Return 404 (not 403) so scanners don't learn the site is live. All three
    # blocks terminate at Nginx so nothing reaches SvelteKit — this keeps the
    # app-level logs (PM2 / Admin → Logs) clean of scanner noise.

    # Dotfiles and dot-directories: /.env, /shared/.env, /.git/*, /.aws/*, /.ssh/*, /.htaccess
    location ~ /\. {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Explicit credential-scanner paths (no dotfile, so the block above misses them)
    location ~* ^/(wp-admin|wp-login\.php|wp-includes|xmlrpc\.php|phpmyadmin|adminer|config\.php|server-status|server-info|actuator)(/|$) {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Suspicious file extensions that should never be served
    location ~* \.(sh|sql|bak|cfg|log|ini|yml|yaml|swp|orig|pem|key|crt|old)$ {
        access_log off;
        log_not_found off;
        return 404;
    }
}
