<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<!-- Favicon — SVG for modern browsers, PNG fallback -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg?v=2" type="image/svg+xml" />
		<link
			rel="icon"
			href="%sveltekit.assets%/apple-touch-icon.png"
			sizes="180x180"
			type="image/png"
		/>

		<!-- iOS home-screen / PWA -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- Chromium logs a deprecation warning for the Apple-prefixed tag alone.
		     The `mobile-web-app-capable` form is the standard; the Apple one is
		     kept for older iOS Safari that doesn't recognise the standard name. -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<!-- Status bar style intentionally omitted (defaults to "default"). The
		     "black-translucent" value is deprecated and triggers a class of
		     layout bugs in iOS PWA standalone mode where the document canvas
		     shifts under the status bar, leaving an unstyled strip at the
		     bottom of every route. With the default style, iOS draws the
		     status bar as its own region above the canvas and no shift occurs.
		     See https://developer.apple.com/forums/thread/89471 -->
		<meta name="apple-mobile-web-app-title" content="Iron Ledger" />

		<!-- Web app manifest (Android / Chrome PWA) -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

		<!-- Theme colour for browser chrome (matches app dark background) -->
		<meta name="theme-color" content="#111827" />

		<!-- Viewport: cover notches, prevent double-tap zoom -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
		/>
		<meta name="description" content="Iron Ledger — Ironsworn character tracker" />
		<!-- Cinzel + Simonetta (display titles) + Roboto (UI & body) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Roboto:ital,wght@0,400;0,500;0,600;1,400&family=Simonetta:ital,wght@0,400;0,900;1,400;1,900&display=swap"
			rel="stylesheet"
		/>
		<!--
			Apply saved theme + display font before first paint to prevent flash.
			Theme: "auto" (or missing key) → no attribute → CSS media query decides.
			Font:  "simonetta" → override --font-display; anything else → Cinzel (default).
		-->
		<script>
			(function () {
				var t = localStorage.getItem('theme');
				if (t === 'dark' || t === 'light') {
					document.documentElement.setAttribute('data-theme', t);
				}
				var FONT_STACKS = {
					simonetta: "'Simonetta', 'Palatino Linotype', Georgia, serif",
					futhark: "'Segoe UI Historic', 'Noto Sans Runic', 'Apple Symbols', system-ui, sans-serif",
				};
				var f = localStorage.getItem('ironledger:font:display');
				if (f !== 'simonetta' && f !== 'futhark') f = 'cinzel';
				// Always set data-font — including the cinzel default — so
				// [data-font='cinzel']-scoped rules (Gravestone chrome palette
				// in app.css) match on first paint, no FOUC on font swap.
				document.documentElement.setAttribute('data-font', f);
				if (f !== 'cinzel') {
					document.documentElement.style.setProperty('--font-display', FONT_STACKS[f]);
				}
			})();
		</script>
		%sveltekit.head%

		<!--
			Mobile in-page DevTools (eruda). Loaded only when the URL has
			?debug=1 — zero cost otherwise. Once eruda has loaded, the
			query param is also stored in sessionStorage so the panel
			survives client-side navigations within the session.

			Visit https://iron-ledger.org/home?debug=1 (or any page) to
			activate; tap the ⚙ icon bottom-right to open the console.
		-->
		<script>
			(function () {
				var hasParam = location.search.indexOf('debug=1') !== -1;
				var sticky = sessionStorage.getItem('il:debug') === '1';
				if (!hasParam && !sticky) return;
				if (hasParam) sessionStorage.setItem('il:debug', '1');
				var s = document.createElement('script');
				s.src = 'https://cdn.jsdelivr.net/npm/eruda';
				s.onload = function () {
					window.eruda && window.eruda.init();
				};
				document.head.appendChild(s);
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
