<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<!-- Favicon — SVG for modern browsers, PNG fallback -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg?v=2" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/apple-touch-icon.png" sizes="180x180" type="image/png" />

		<!-- iOS home-screen / PWA -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Iron Ledger" />

		<!-- Web app manifest (Android / Chrome PWA) -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

		<!-- Theme colour for browser chrome (matches app dark background) -->
		<meta name="theme-color" content="#111827" />

		<!-- Viewport: cover notches, prevent double-tap zoom -->
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
		<meta name="description" content="Iron Ledger — Ironsworn character tracker" />
		<!-- Cinzel (engraved display titles) + Roboto (UI & body) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Roboto:ital,wght@0,400;0,500;0,600;1,400&display=swap"
			rel="stylesheet"
		/>
		<!--
			Apply saved theme before first paint to prevent flash.
			"auto" (or missing key) → no attribute → CSS media query decides.
		-->
		<script>
			(function () {
				var t = localStorage.getItem('theme');
				if (t === 'dark' || t === 'light') {
					document.documentElement.setAttribute('data-theme', t);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
